name: bv_ui
description: Design system BuildingVision mobile — token, badge, card, checklist runner
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  bv_core:
    path: ../bv_core
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/images/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
