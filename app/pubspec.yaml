name: bv_staff
description: BuildingVision Staff App — technician, security officer, housekeeping staff, supervisor
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bv_core:
    path: ../packages/bv_core
  bv_api:
    path: ../packages/bv_api
  bv_sync:
    path: ../packages/bv_sync
  bv_ui:
    path: ../packages/bv_ui
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  flutter_secure_storage: ^11.1.1
  connectivity_plus: ^7.3.1
  mobile_scanner: ^7.4.2
  geolocator: ^14.0.3
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  cached_network_image: ^4.0.0
  dio: ^5.7.0
